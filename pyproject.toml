[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "revtrend"
version = "0.1.0"
description = "Track numeric metrics per git commit and visualize trends in Grafana"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simon Holesch", email = "simon@holesch.de" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi",
    "httpx",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "PyJWT[crypto]",
    "truststore>=0.10.5",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/holesch/revtrend"
Source = "https://github.com/holesch/revtrend"
Issues = "https://github.com/holesch/revtrend/issues"

[project.scripts]
revtrend = "revtrend.cli:main"
revtrend-server = "revtrend.server:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff==0.14.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # Pylint
    "FLY",    # flynt
    "FURB",   # refurb
    "RUF",    # Ruff-specific rules
]
ignore = [
    # "Line too long"
    # -> ruff format handles code, long strings are fine
    "E501",
    # "for loop variable overwritten by assignment target"
    "PLW2901",
    # "Use `from x import y` in lieu of alias"
    # -> style: absolute module imports only, aliased where necessary
    "PLR0402",
    # "open() should be replaced by Path.open()"
    # -> creating a Path object just to open a file is overkill
    "PTH123",
    # "subprocess call: check for execution of untrusted input"
    # -> false positives, git is called with argument lists
    "S603",
    # "Use ternary operator instead of if-else-block"
    # -> can make the code less readable
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    # "Magic value used in comparison"
    "PLR2004",
    # "Use of assert detected"
    "S101",
    # "Starting a process with a partial executable path"
    "S607",
    # "Unused function argument"
    # -> fixtures requested for their side effects
    "ARG001",
    # "Too many arguments in function definition"
    "PLR0913",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
