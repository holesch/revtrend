[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "revtrend"
version = "0.1.0"
description = "Track numeric metrics per git commit and visualize trends in Grafana"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "PyJWT[crypto]",
    "uvicorn",
]

[project.scripts]
revtrend = "revtrend.cli:main"
revtrend-server = "revtrend.server:main"
